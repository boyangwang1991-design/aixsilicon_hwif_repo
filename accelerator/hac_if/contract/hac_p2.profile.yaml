# AIXSILICON HW Interface Profile — hac_p2
# HAC-P2 Memory Profile：GEMM、FFT、压缩、批处理（主动访存型默认 Profile）。
# 标准 profile 结构（引用基础接口 ID，冻结 capability；不复制信号）。
schema_version: "1.0"

profile:
  id: IFC-PROFILE-HAC-P2-001
  interface: IFC-HAC-MEM-001
  version: 0.1.0
  owner: hw-platform
  lifecycle: draft
  capabilities:
    event: required
    ctrl_ap_hs: required
    mem_master: required
    stream: optional
    lmem: optional
    mgmt: optional
  parameter_constraints:
    max_inflight_jobs:
      min: 1
      max: 4
    address_width:
      fixed: 64
    data_width:
      fixed: 128
    out_of_order:
      fixed: false
  compatibility_class: hac_p2_v1
  description: |
    HAC-P2 Memory — 必选 CTRL + MEM + EVENT，推荐系统侧接口 AXI4-Lite + AXI4 Master。
    required_families: hac_ctrl + hac_mem + hac_event；其余为可选族。
