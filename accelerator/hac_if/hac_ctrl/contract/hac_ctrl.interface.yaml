    to: shell
    width: STATUS_W
    required: false
    capability: config_commit
    default_tieoff: 0
- id: cmd
  handshake: ready_valid
  clock: clk
  reset: rst_n
  ordering: in_order
  signals:
  - id: cmd_valid
    from: shell
    to: core
    width: '1'
    required: true
  - id: cmd_ready
    from: core
    to: shell
    width: '1'
    required: true
  - id: cmd_job_id
    from: shell
    to: core
    width: JOB_ID_W
    required: true
  - id: cmd_opcode
    from: shell
    to: core
