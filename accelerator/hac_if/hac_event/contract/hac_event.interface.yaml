# AIXSILICON HW Interface Contract — hac_event
# HAC-EVENT 事件接口（L6）。
schema_version: "1.0"

interface:
  id: IFC-HAC-EVT-001
  name: aix_hac_event
  family: hac_event
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-HAC-IF-005
  revision: "0.1"

roles:
  - id: core
    aliases: [producer]
  - id: shell
    aliases: [consumer]

parameters:
  - id: EVENT_TYPE_W
    type: uint
    default: 3
    constraints:
      min: 1
  - id: SEVERITY_W
    type: uint
    default: 2
    constraints:
      min: 1
  - id: SOURCE_W
    type: uint
    default: 8
    constraints:
      min: 1
  - id: JOB_ID_W
    type: uint
    default: 8
    constraints:
      min: 0
  - id: CODE_W
    type: uint
    default: 16
    constraints:
      min: 1
  - id: INFO_W
    type: uint
    default: 32
    constraints:
      min: 0

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: event
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: event_valid
        from: core
        to: shell
        width: "1"
        required: true
      - id: event_ready
        from: shell
        to: core
        width: "1"
        required: true
      - id: event_type
        from: core
        to: shell
        width: "EVENT_TYPE_W"
        required: true
      - id: severity
        from: core
        to: shell
        width: "SEVERITY_W"
        required: true
      - id: source
        from: core
        to: shell
        width: "SOURCE_W"
        required: true
      - id: job_id
        from: core
        to: shell
        width: "JOB_ID_W"
        required: false
        capability: job_id
      - id: code
        from: core
        to: shell
        width: "CODE_W"
        required: true
      - id: info
        from: core
        to: shell
        width: "INFO_W"
        required: false
        capability: info

capabilities:
  - id: job_id
    default: true
  - id: info
    default: true

semantics:
  valid_ready: "event delivered via valid/ready + event payload; interrupt generated by Shell from event policy"
  no_silent_drop: "error events must not be silently dropped before consumption"
  fatal_sticky: "fatal events have independent sticky state; soft reset must not clear diagnostic evidence by default"
  core_no_irq: "Core does not emit CPU interrupt protocol directly"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
