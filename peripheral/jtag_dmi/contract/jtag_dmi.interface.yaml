# AIXSILICON HW Interface Contract — jtag_dmi（骨架）
# JTAG 与 DMI 接口（L4）。
schema_version: "1.0"

interface:
  id: IFC-JTAG-001
  name: aix_jtag_dmi
  family: jtag_dmi
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: open
  document_id: IEEE-1149.1
  revision: "JTAG"

roles:
  - id: controller
  - id: endpoint

parameters: []

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: jtag_pins
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: tck
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: tms
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: tdi
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: tdo
        from: endpoint
        to: controller
        width: "1"
        required: true
      - id: trst_n
        from: controller
        to: endpoint
        width: "1"
        required: false
        capability: reset_line

  - id: dmi
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: dmi_req_valid
        from: controller
        to: endpoint
        width: "1"
        required: false
        capability: dmi
      - id: dmi_req_ready
        from: endpoint
        to: controller
        width: "1"
        required: false
        capability: dmi
      - id: dmi_req
        from: controller
        to: endpoint
        width: "34"
        required: false
        capability: dmi
      - id: dmi_rsp_valid
        from: endpoint
        to: controller
        width: "1"
        required: false
        capability: dmi
      - id: dmi_rsp
        from: endpoint
        to: controller
        width: "34"
        required: false
        capability: dmi

capabilities:
  - id: reset_line
    default: false
  - id: dmi
    default: false

semantics:
  tck_domain: "JTAG clock may be asynchronous to clk"
  dmi: "RISC-V Debug Module Interface"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
