    from: core
    to: shell
    width: '1'
    required: false
    capability: config_commit
    default_tieoff: 0
  - id: cfg_rsp_ready
    from: shell
    to: core
    width: '1'
    required: false
    capability: config_commit
    default_tieoff: 0
  - id: cfg_rsp_job_id
    from: core
    to: shell
    width: JOB_ID_W
    required: false
    capability: config_commit
    default_tieoff: 0
  - id: cfg_rsp_slot
    from: core
    to: shell
    width: CFG_SLOT_W
    required: false
    capability: config_commit
    default_tieoff: 0
  - id: cfg_rsp_status
