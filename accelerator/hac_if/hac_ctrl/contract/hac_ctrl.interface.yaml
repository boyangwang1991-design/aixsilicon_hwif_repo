  - id: cmd_cfg_slot
    from: shell
    to: core
    width: CFG_SLOT_W
    required: false
    capability: config_commit
    default_tieoff: 0
  - id: cmd_desc_addr
    from: shell
    to: core
    width: ADDR_W
    required: false
    capability: descriptor
    default_tieoff: 0
  - id: cmd_param_version
    from: shell
    to: core
    width: PARAM_VERSION_W
    required: false
    capability: descriptor
    default_tieoff: 0
  - id: cmd_param_bytes
    from: shell
    to: core
    width: PARAM_LEN_W
    required: false
