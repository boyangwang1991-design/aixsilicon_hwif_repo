# AIXSILICON HW Interface Contract — axi_lite
# AMBA AXI4-Lite 端点契约（L3）。
schema_version: "1.0"

interface:
  id: IFC-AXIL-001
  name: aix_axi_lite
  family: axi_lite
  semantic_version: 1.0.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: commercial
  document_id: AMBA-AXI-PROTOCOL
  revision: "AXI4-Lite"
  url: https://developer.arm.com/Architectures/AMBA

roles:
  - id: initiator
    aliases: [manager, master]
  - id: target
    aliases: [subordinate, slave]

parameters:
  - id: ADDR_W
    type: uint
    default: 32
    constraints:
      min: 1
  - id: DATA_W
    type: uint
    default: 32
    constraints:
      min: 32
      multiple_of: 32
  - id: USER_W
    type: uint
    default: 1
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: aw
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: aw_valid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: aw_ready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: aw_addr
        from: initiator
        to: target
        width: "ADDR_W"
        required: true
      - id: aw_prot
        from: initiator
        to: target
        width: "3"
        required: false
        capability: protection
      - id: aw_user
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: w
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: w_valid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: w_ready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: w_data
        from: initiator
        to: target
        width: "DATA_W"
        required: true
      - id: w_strb
        from: initiator
        to: target
        width: "DATA_W / 8"
        required: true
      - id: w_user
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: b
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: b_valid
        from: target
        to: initiator
        width: "1"
        required: true
      - id: b_ready
        from: initiator
        to: target
        width: "1"
        required: true
      - id: b_resp
        from: target
        to: initiator
        width: "2"
        required: true
        description: "OKAY/SLVERR/DECERR"
      - id: b_user
        from: target
        to: initiator
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: ar
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: ar_valid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: ar_ready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: ar_addr
        from: initiator
        to: target
        width: "ADDR_W"
        required: true
      - id: ar_prot
        from: initiator
        to: target
        width: "3"
        required: false
        capability: protection
      - id: ar_user
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: r
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: r_valid
        from: target
        to: initiator
        width: "1"
        required: true
      - id: r_ready
        from: initiator
        to: target
        width: "1"
        required: true
      - id: r_data
        from: target
        to: initiator
        width: "DATA_W"
        required: true
      - id: r_resp
        from: target
        to: initiator
        width: "2"
        required: true
        description: "OKAY/SLVERR/DECERR"
      - id: r_user
        from: target
        to: initiator
        width: "USER_W"
        required: false
        capability: user_sideband

capabilities:
  - id: protection
    default: false
  - id: user_sideband
    default: false

semantics:
  transfer: "valid && ready"
  single_beat_only: true
  resp_encoding: "00=OKAY, 10=SLVERR, 11=DECERR"
  write_ordering: "B response follows W data"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
