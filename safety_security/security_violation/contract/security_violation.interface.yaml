# AIXSILICON HW Interface Contract — security_violation
# 安全违规上报接口（L6，P2）。
schema_version: "1.0"

interface:
  id: IFC-SECV-001
  name: aix_security_violation
  family: security_violation
  semantic_version: 0.1.0
  owner: hw-fusa
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-SECV-001
  revision: "0.1"

roles:
  - id: source
  - id: sink

parameters:
  - id: SOURCE_W
    type: uint
    default: 8
    constraints:
      min: 1
  - id: EVIDENCE_W
    type: uint
    default: 64
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: violation
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: viol_valid
        from: source
        to: sink
        width: "1"
        required: true
      - id: viol_ready
        from: sink
        to: source
        width: "1"
        required: true
      - id: viol_source
        from: source
        to: sink
        width: "SOURCE_W"
        required: true
      - id: viol_class
        from: source
        to: sink
        width: "8"
        required: true
      - id: viol_fatal
        from: source
        to: sink
        width: "1"
        required: true
      - id: viol_evidence
        from: source
        to: sink
        width: "EVIDENCE_W"
        required: true

capabilities: []

semantics:
  security_violation: "source/class/fatality/evidence summary"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
