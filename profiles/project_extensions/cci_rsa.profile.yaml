profile:
  id: IFC-PROFILE-CCI-RSA-0-2
  interface: IFC-CCI-001
  version: 0.2.0
  owner: security-crypto
  lifecycle: draft
  capabilities:
    sha2: forbidden
    chacha_poly: forbidden
    rsa: required
  parameter_constraints:
    DATA_W:
    - 32
    - 64
    - 128
    - 256
    - 512
  compatibility_class: cci_rsa_v0_2
  description: RSA PSS、可选 PKCS1-v1_5 签名与 OAEP；v0.1.0 consumer scope 固定 CRT2 与 internal SHA-2；无实现资格声明
