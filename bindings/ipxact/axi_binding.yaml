# AIXSILICON IP-XACT Binding 示例 — AXI4
# 映射接口契约到 IP-XACT 交换视图（plan §20）。
binding:
  interface: aixsilicon:interface:axi:1.0.0
  target: aix:ipxact:axi:1.0.0
  kind: ipxact
  role_map:
    initiator: master
    target: slave
  sv_interface: axi_if
  parameters:
    bus_definition: aixsilicon:interface:axi:1.0.0
    abstraction_definition: aixsilicon:interface:axi_abs:1.0.0
  signal_map:
    - {contract_signal: awvalid, target_signal: AWVALID}
    - {contract_signal: awready, target_signal: AWREADY}
    - {contract_signal: awaddr, target_signal: AWADDR}
    - {contract_signal: wvalid, target_signal: WVALID}
    - {contract_signal: wready, target_signal: WREADY}
    - {contract_signal: wdata, target_signal: WDATA}
    - {contract_signal: bvalid, target_signal: BVALID}
    - {contract_signal: bready, target_signal: BREADY}
    - {contract_signal: arvalid, target_signal: ARVALID}
    - {contract_signal: arready, target_signal: ARREADY}
    - {contract_signal: araddr, target_signal: ARADDR}
    - {contract_signal: rvalid, target_signal: RVALID}
    - {contract_signal: rready, target_signal: RREADY}
    - {contract_signal: rdata, target_signal: RDATA}
  description: AXI4 到 IP-XACT 的交换视图映射（派生，不取代 YAML SSOT）。
