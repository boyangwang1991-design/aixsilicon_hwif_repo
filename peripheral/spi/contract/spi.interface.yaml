# AIXSILICON HW Interface Contract — spi（骨架）
# SPI 接口（L4）。
schema_version: "1.0"

interface:
  id: IFC-SPI-001
  name: aix_spi
  family: spi
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: open
  document_id: SPI-NONE
  revision: "n/a"
  note: "SPI 为事实标准，本仓只声明接口契约"

roles:
  - id: controller
    aliases: [master]
  - id: endpoint
    aliases: [slave, device]

parameters:
  - id: CS_W
    type: uint
    default: 1
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: spi_pins
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: sclk
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: cs
        from: controller
        to: endpoint
        width: "CS_W"
        required: true
      - id: mosi
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: miso
        from: endpoint
        to: controller
        width: "1"
        required: true
      - id: io
        from: controller
        to: endpoint
        width: "4"
        required: false
        capability: quad_mode
        description: "dual/quad 数据线（含 OE 分离视图）"

capabilities:
  - id: quad_mode
    default: false

semantics:
  mode: "CPOL/CPHA declared in profile"
  quad_io: "bidirectional lines split into _i/_o/_oe_o"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
