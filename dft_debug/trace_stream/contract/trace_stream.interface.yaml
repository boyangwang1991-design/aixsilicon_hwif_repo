# AIXSILICON HW Interface Contract — trace_stream（骨架）
# 跟踪流接口（L5）。
schema_version: "1.0"

interface:
  id: IFC-TRACE-001
  name: aix_trace_stream
  family: trace_stream
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-TRACE-001
  revision: "0.1"

roles:
  - id: source
  - id: sink

parameters:
  - id: DATA_W
    type: uint
    default: 64
    constraints:
      min: 8
      multiple_of: 8
  - id: SOURCE_W
    type: uint
    default: 8
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: trace
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: trace_valid
        from: source
        to: sink
        width: "1"
        required: true
      - id: trace_ready
        from: sink
        to: source
        width: "1"
        required: true
      - id: trace_data
        from: source
        to: sink
        width: "DATA_W"
        required: true
      - id: trace_source
        from: source
        to: sink
        width: "SOURCE_W"
        required: true
      - id: trace_overflow
        from: source
        to: sink
        width: "1"
        required: true

capabilities: []

semantics:
  timestamp: "carried in payload or sideband per profile"
  overflow: "indicates dropped events"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
