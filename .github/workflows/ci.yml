name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract-structure:
    name: Contract & core structure gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Contracts are parseable YAML with stable identity
        run: python3 - <<'EOF'
import glob, sys, yaml
bad = []
contracts = glob.glob("**/*.interface.yaml", recursive=True) + glob.glob("**/*.profile.yaml", recursive=True)
for c in sorted(contracts):
    if "/generated/" in c:
        continue
    d = yaml.safe_load(open(c, encoding="utf-8"))
    if not isinstance(d, dict):
        bad.append(f"{c}: not a mapping"); continue
    iface = d.get("interface")
    if iface and not isinstance(iface, dict):
        bad.append(f"{c}: interface not a mapping")
    if iface and not all(k in iface for k in ("id", "name", "family", "semantic_version")):
        bad.append(f"{c}: interface missing id/name/family/semantic_version")
    prof = d.get("profile")
    if prof and not all(k in prof for k in ("id", "interface", "version", "capabilities")):
        bad.append(f"{c}: profile missing id/interface/version/capabilities")
for e in bad:
    print("FAIL", e, file=sys.stderr)
if bad:
    sys.exit(1)
print(f"structure OK: {len(contracts)} contract/profile parsed")
EOF
      - name: FuseSoC .core namespace & CAPI gate
        run: python3 - <<'EOF'
import glob, re, sys
errs = []
for c in sorted(glob.glob("**/*.core", recursive=True)):
    if "/generated/" in c or "/reference/" in c:
        continue
    t = open(c, encoding="utf-8").read()
    if "CAPI=2:" not in t:
        errs.append(f"{c}: missing CAPI=2")
    m = re.search(r"name:\s*(\S+)", t)
    if m and not m.group(1).startswith("aix:"):
        errs.append(f"{c}: non-aix namespace {m.group(1)}")
for e in errs:
    print("FAIL", e, file=sys.stderr)
if errs:
    sys.exit(1)
print("core gate OK")
EOF
      - name: No deterministic tooling lives in this repo
        run: |
          test ! -d tools && echo "tools/ removed (deterministic entry is hwif-development-suite)" || (echo "FAIL: tools/ still present" && exit 1)
          test ! -d tests && echo "tests/ removed (covered by hwif-development-suite)" || (echo "FAIL: tests/ still present" && exit 1)
