# AIXSILICON HW Interface Profile — AXI4 DMA 高带宽（plan §12.2 axi_dma_high_bw_v1）
profile:
  id: IFC-PROFILE-AXI4-DMA-HIBW-1
  interface: IFC-AXI-001
  version: 1.0.0
  owner: hw-platform
  lifecycle: draft
  capabilities:
    atop: optional
    user_sideband: optional
    exclusive: forbidden
  parameter_constraints:
    DATA_W: [64, 128, 256, 512, 1024]
    ID_W: [4, 8, 12, 16]
    ADDR_W: [64]
  compatibility_class: axi_dma_high_bw_v1
  description: >-
    AXI4 DMA 高带宽 Profile：大数据位宽、深 ID，可选 ATOP/USER，
    用于 DMA/数据搬运通路（plan §12.2 axi_dma_high_bw_v1）。
