# AIXSILICON HW Interface Contract — power_state（骨架）
# 电源状态接口（L1）。
schema_version: "1.0"

interface:
  id: IFC-PW-001
  name: aix_power_state
  family: power_state
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-PW-001
  revision: "0.1"

roles:
  - id: controller
  - id: endpoint

parameters:
  - id: STATE_W
    type: uint
    default: 4
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: pwr
    handshake: req_ack
    clock: clk
    reset: rst_n
    signals:
      - id: pwr_state_req
        from: controller
        to: endpoint
        width: "STATE_W"
        required: true
      - id: pwr_state_ack
        from: endpoint
        to: controller
        width: "1"
        required: true
      - id: pwr_state
        from: endpoint
        to: controller
        width: "STATE_W"
        required: true
      - id: wake_event
        from: endpoint
        to: controller
        width: "1"
        required: false
        capability: wake

capabilities:
  - id: wake
    default: false

semantics:
  power_request_flow: "request -> accept/state -> transition"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
