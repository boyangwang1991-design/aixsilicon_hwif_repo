# AIXSILICON HW Interface Contract — axi
# AMBA AXI4 端点契约（L3）。
schema_version: "1.0"

interface:
  id: IFC-AXI-001
  name: axi
  family: axi
  semantic_version: 1.0.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: commercial
  document_id: AMBA-AXI-PROTOCOL
  revision: "AXI4"
  url: https://developer.arm.com/documentation/102202/latest/AXI-protocol-overview
  note: "点到点接口协议；Crossbar 拓扑不属于本契约"

roles:
  - id: initiator
    aliases: [manager, master]
  - id: target
    aliases: [subordinate, slave]

parameters:
  - id: ID_W
    type: uint
    default: 8
    constraints:
      min: 1
  - id: ADDR_W
    type: uint
    default: 64
    constraints:
      min: 1
  - id: DATA_W
    type: uint
    default: 64
    constraints:
      min: 8
      multiple_of: 8
  - id: USER_W
    type: uint
    default: 1
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: aw
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: awvalid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: awready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: awid
        from: initiator
        to: target
        width: "ID_W"
        required: true
      - id: awaddr
        from: initiator
        to: target
        width: "ADDR_W"
        required: true
      - id: awlen
        from: initiator
        to: target
        width: "8"
        required: true
      - id: awsize
        from: initiator
        to: target
        width: "3"
        required: true
      - id: awburst
        from: initiator
        to: target
        width: "2"
        required: true
      - id: awlock
        from: initiator
        to: target
        width: "1"
        required: true
      - id: awcache
        from: initiator
        to: target
        width: "4"
        required: true
      - id: awprot
        from: initiator
        to: target
        width: "3"
        required: true
      - id: awqos
        from: initiator
        to: target
        width: "4"
        required: true
      - id: awregion
        from: initiator
        to: target
        width: "4"
        required: true
      - id: awatop
        from: initiator
        to: target
        width: "6"
        required: false
        capability: atop
      - id: awuser
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: w
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: wvalid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: wready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: wdata
        from: initiator
        to: target
        width: "DATA_W"
        required: true
      - id: wstrb
        from: initiator
        to: target
        width: "DATA_W / 8"
        required: true
      - id: wlast
        from: initiator
        to: target
        width: "1"
        required: true
      - id: wuser
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: b
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: bvalid
        from: target
        to: initiator
        width: "1"
        required: true
      - id: bready
        from: initiator
        to: target
        width: "1"
        required: true
      - id: bid
        from: target
        to: initiator
        width: "ID_W"
        required: true
      - id: bresp
        from: target
        to: initiator
        width: "2"
        required: true
      - id: buser
        from: target
        to: initiator
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: ar
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: arvalid
        from: initiator
        to: target
        width: "1"
        required: true
      - id: arready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: arid
        from: initiator
        to: target
        width: "ID_W"
        required: true
      - id: araddr
        from: initiator
        to: target
        width: "ADDR_W"
        required: true
      - id: arlen
        from: initiator
        to: target
        width: "8"
        required: true
      - id: arsize
        from: initiator
        to: target
        width: "3"
        required: true
      - id: arburst
        from: initiator
        to: target
        width: "2"
        required: true
      - id: arlock
        from: initiator
        to: target
        width: "1"
        required: true
      - id: arcache
        from: initiator
        to: target
        width: "4"
        required: true
      - id: arprot
        from: initiator
        to: target
        width: "3"
        required: true
      - id: arqos
        from: initiator
        to: target
        width: "4"
        required: true
      - id: arregion
        from: initiator
        to: target
        width: "4"
        required: true
      - id: aruser
        from: initiator
        to: target
        width: "USER_W"
        required: false
        capability: user_sideband

  - id: r
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: rvalid
        from: target
        to: initiator
        width: "1"
        required: true
      - id: rready
        from: initiator
        to: target
        width: "1"
        required: true
      - id: rid
        from: target
        to: initiator
        width: "ID_W"
        required: true
      - id: rdata
        from: target
        to: initiator
        width: "DATA_W"
        required: true
      - id: rresp
        from: target
        to: initiator
        width: "2"
        required: true
      - id: rlast
        from: target
        to: initiator
        width: "1"
        required: true
      - id: ruser
        from: target
        to: initiator
        width: "USER_W"
        required: false
        capability: user_sideband

capabilities:
  - id: atop
    default: false
    description: 原子操作（AW 通道 ATOP 字段）。
  - id: user_sideband
    default: false
  - id: exclusive
    default: false
    description: 独占访问支持（Exclusive Access）。

semantics:
  transfer: "valid && ready"
  resp_encoding: "00=OKAY, 01=EXOKAY, 10=SLVERR, 11=DECERR"
  write_ordering: "B response follows final w_last"
  read_ordering: "R response follows ar"
  burst_types: "FIXED=00, INCR=01, WRAP=10"
  exclusive: "paired exclusive read/write, EXOKAY on success"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
