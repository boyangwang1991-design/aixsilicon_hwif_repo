# AIXSILICON HW Interface Contract — gpio（骨架）
# GPIO 接口（L4）。
schema_version: "1.0"

interface:
  id: IFC-GPIO-001
  name: aix_gpio
  family: gpio
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-GPIO-001
  revision: "0.1"

roles:
  - id: controller
  - id: endpoint

parameters:
  - id: WIDTH
    type: uint
    default: 32
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: gpio_pins
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: gpio_i
        from: endpoint
        to: controller
        width: "WIDTH"
        required: true
      - id: gpio_o
        from: controller
        to: endpoint
        width: "WIDTH"
        required: true
      - id: gpio_oe_o
        from: controller
        to: endpoint
        width: "WIDTH"
        required: true
      - id: gpio_irq
        from: endpoint
        to: controller
        width: "WIDTH"
        required: false
        capability: interrupt_sideband

capabilities:
  - id: interrupt_sideband
    default: false

semantics:
  bidirectional_split: "gpio_i / gpio_o / gpio_oe_o"
  irq: "edge/level config in IP register"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
