semantics:
  transfer: valid && ready；停顿中保持valid/payload，取消经drain或双端reset，不单边撤回。
  namespace: 父owner/instance/epoch/task/request_seq/context/generation完整保留；invocation_id独立64-bit；physical
    MAC bank/CORE tag独立于父context。
  admission: RESERVE先冻结参数并预留child/响应/服务credit，caller取得lease后才能提交父任务；EXECUTE仅身份/调用ID/lease/action非零，不能TOCTOU改参数。
  actions:
  - 0=RESERVE
  - 1=EXECUTE
  - 2=RELEASE
  - 3=CANCEL
  - 4=QUERY
  templates:
  - '0=PROTECTED_HMAC: REF key及一项SECRET消息，支持GEN/VERIFY'
  - '1=HKDF_EXTRACT: PUBLIC_PARAMETER key及一项SECRET IKM，GEN only'
  - '2=HKDF_EXPAND: REF PRK，T_prev(若iteration>1)/PUBLIC info/COUNTER，GEN only'
  key_sources:
  - '0=REF: key_ref!=0，key_length精确完整长度，普通MAC最少16 B'
  - '1=PUBLIC_PARAMETER: 仅EXTRACT；key_ref/key_epoch=0，key_length可0或短，禁止普通软件直达'
  parts_layout: 每part232 bits，低part先；bit[7:0]=kind，[71:8]=object_ref，[103:72]=object_epoch，[167:104]=offset，[231:168]=length。三项上限，未用项0。
  part_kinds:
  - '1=PUBLIC: ref/epoch/offset=0，数据来自公开info通道'
  - '2=SECRET: ref!=0，逐range/epoch/use检查，仅provider READ'
  - '3=COUNTER: 仅EXPAND尾项，length=1，其余字段0；byte由iteration内部产生'
  public_sources:
  - 1=SALT，精确key_length且仅EXTRACT
  - 2=INFO，精确PUBLIC part长度且仅EXPAND
  - 3=EXPECTED_TAG，精确tag_length且仅PROTECTED_HMAC VERIFY
  public_data: 低lane先，非末拍keep全1，末拍从低lane连续，last恰为声明长度；长度0不发beat，外国tuple丢弃。
  authorization: 端点仅连接可信KDF/组件，不接软件descriptor；固定template限制秘密执行图。普通use=MAC；KDF use=DERIVE，逐provider角色、policy/key/object
    epoch及父授权校验；公开salt不能冒充key对象。
  result: GEN仅private sink PREPARE/WRITE/COMMIT；ACTIVE后返回ref/epoch/长度，不返回data。VERIFY先USAGE_RESERVE，不退款、固定声明长度比较、无Tag出口。
  cancel: 独立control credit；提交确认后TOO_LATE与原成功终态分开，ACK丢失QUERY同一事务，UNKNOWN隔离且禁止重算。
  cleanup: 终结rsp cleanup_done依赖所有task/cache/staging/egress bank实际清除或协同reset；RESERVE确认不表示算法终结。
  service_ids: provider physical request_id由内部独立nonce分配，保留caller完整invocation_id；结果事务PREPARE/WRITE/COMMIT/QUERY共用同一transaction
    ID。
  version: 0.1.0 draft；命名SHA2 profile才允许装配；接口生成不构成实现资格。
compatibility:
  api_major: 0
  description: 与CCI及crypto_secret provider-client分离，不替换既有端口。
