profile:
  id: IFC-PROFILE-CRYPTO-SECRET-SHA2-KDF-0-2
  interface: IFC-CRYPTO_SECRET-001
  version: 0.2.0
  owner: security-crypto
  lifecycle: draft
  capabilities:
    sha2_hmac_service: required
    sha2_kdf_service: required
    rsa_service: forbidden
  parameter_constraints:
    DATA_W: [32, 64, 128, 256, 512]
