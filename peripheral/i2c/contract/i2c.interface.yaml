# AIXSILICON HW Interface Contract — i2c（骨架）
# I2C 接口（L4）。
schema_version: "1.0"

interface:
  id: IFC-I2C-001
  name: aix_i2c
  family: i2c
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: commercial
  document_id: NXP-I2C-BUS
  revision: "I2C-bus specification"

roles:
  - id: controller
    aliases: [master]
  - id: endpoint
    aliases: [slave, device]

parameters: []

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: i2c_pins
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: scl_o
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: scl_oe_o
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: scl_i
        from: endpoint
        to: controller
        width: "1"
        required: true
      - id: sda_o
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: sda_oe_o
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: sda_i
        from: endpoint
        to: controller
        width: "1"
        required: true

capabilities: []

semantics:
  open_drain: "lines are open-drain; oe controls drive"
  bidirectional_split: "each line split into _o/_oe_o/_i"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
