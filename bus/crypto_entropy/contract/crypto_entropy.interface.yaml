    to: source
    width: '64'
    required: true
  - id: req_length
    from: consumer
    to: source
    width: '32'
    required: true
- id: rsp
  handshake: ready_valid
  clock: clk
  reset: reset_n
  ordering: in_order
  signals:
  - id: rsp_valid
    from: source
    to: consumer
    width: '1'
    required: true
  - id: rsp_ready
    from: consumer
    to: source
    width: '1'
    required: true
  - id: rsp_owner_id
    from: source
    to: consumer
    width: '32'
    required: true
  - id: rsp_instance_id
    from: source
