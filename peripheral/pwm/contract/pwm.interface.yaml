# AIXSILICON HW Interface Contract — pwm
# PWM 输出接口（L4，P2）。
schema_version: "1.0"

interface:
  id: IFC-PWM-001
  name: aix_pwm
  family: pwm
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-PWM-001
  revision: "0.1"

roles:
  - id: controller
  - id: endpoint

parameters:
  - id: CH_W
    type: uint
    default: 4
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: pwm_out
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: pwm_ch
        from: controller
        to: endpoint
        width: "CH_W"
        required: true
      - id: pwm_ch_n
        from: controller
        to: endpoint
        width: "CH_W"
        required: false
        capability: complementary
      - id: pwm_dead_time
        from: controller
        to: endpoint
        width: "8"
        required: false
        capability: dead_time

capabilities:
  - id: complementary
    default: false
  - id: dead_time
    default: false

semantics:
  pwm: "channel outputs; complementary/dead-time per capability"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
