# AIXSILICON HW Interface Contract Schema
# 接口语义唯一事实源（SSOT）的 JSON Schema 描述（YAML 表示）。
# 校验：tools/contract_validate/contract_validate.py
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aixsilicon.com/schema/interface_contract.schema.yaml"
title: "AIXSILICON HW Interface Contract"
description: >-
  定义接口的身份、角色、通道、信号、参数、时钟/复位/电源/CDC 属性、
  Capability、语义与派生视图。宽度表达式必须是受限表达式（见 width_pattern），
  方向使用 from/to role，不允许任意脚本。

type: object
additionalProperties: false
required:
  - schema_version
  - interface
  - roles
  - channels
  - views

properties:
  schema_version:
    type: string
    const: "1.0"
    description: 本 Schema 的版本号。

  interface:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - family
      - semantic_version
      - owner
      - lifecycle
    properties:
      id:
        type: string
        pattern: "^IFC-[A-Z0-9_]+-[0-9]{3}$"
        description: 稳定接口 ID，例如 IFC-STREAM-001。
      name:
        type: string
        pattern: "^aix_[a-z0-9_]+$"
        description: 接口名，作为 package/interface 命名前缀。
      family:
        type: string
        description: 接口族，例如 stream / axi / memory。
      semantic_version:
        type: string
        pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"
        description: SemVer 版本。
      owner:
        type: string
        description: 责任团队标识。
      lifecycle:
        type: string
        enum: [draft, reviewed, qualified, proven, deprecated]
      deprecated_since:
        type: string
        description: 标记为 deprecated 的版本（若有）。
      replacement:
        type: string
        description: 替代接口 ID（若 deprecated）。

  protocol_reference:
    type: object
    description: 受控规范引用；正文不复制进仓库。
    additionalProperties: false
    required: [kind, document_id, revision]
    properties:
      kind:
        type: string
        enum: [internal, commercial, open, other]
      document_id:
        type: string
      revision:
        type: string
      url:
        type: string
        format: uri
      note:
        type: string

  roles:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          description: 统一角色名，如 initiator/target、source/sink。
        aliases:
          type: array
          items: {type: string}
          description: 协议原生别名（master/slave 等），仅作元数据，不视为新类型。
        description:
          type: string

  parameters:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, type, default]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        type:
          type: string
          enum: [uint, int, enum, bool, string]
        default:
          description: 参数默认值（类型依 type 而定）。
        constraints:
          type: object
          additionalProperties: false
          properties:
            min: {}
            max: {}
            multiple_of: {type: number}
            enum: {type: array}
            pattern: {type: string}
          description: 允许 min/max/multiple_of/enum/pattern，禁止任意脚本。
        description:
          type: string

  clock_domains:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, edge]
      properties:
        id: {type: string}
        edge:
          type: string
          enum: [rising, falling, both]
        frequency_hz:
          type: number
        description: {type: string}

  reset_domains:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, polarity, assertion, clock]
      properties:
        id: {type: string}
        polarity:
          type: string
          enum: [active_low, active_high]
        assertion:
          type: string
          enum: [synchronous, asynchronous]
        deassertion:
          type: string
          enum: [synchronous, asynchronous]
        clock: {type: string}
        output_during_reset:
          description: reset 期间输出要求。
        min_stable_after_release:
          description: reset 释放后最小稳定周期。
        can_interrupt_transactions:
          type: boolean
        description: {type: string}

  channels:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, signals]
      properties:
        id: {type: string}
        handshake:
          type: string
          enum: [ready_valid, req_ack, event, none]
        clock: {type: string}
        reset: {type: string}
        ordering:
          type: string
          enum: [in_order, out_of_order, relaxed]
        cdc:
          type: object
          additionalProperties: false
          properties:
            source_clock: {type: string}
            destination_clock: {type: string}
            relationship:
              type: string
              enum: [synchronous, asynchronous, mesochronous, unknown]
            allowed_methods:
              type: array
              items: {type: string}
            description: {type: string}
        power:
          type: object
          additionalProperties: false
          properties:
            source_domain: {type: string}
            destination_domain: {type: string}
            isolation_direction:
              type: string
              enum: [none, source_to_target, target_to_source, bidirectional]
            default_clamp: {}
            retention_required: {type: boolean}
            signals_valid_when_off: {type: boolean}
        signals:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, from, to, width]
            properties:
              id: {type: string}
              from:
                type: string
                description: 信号源角色。
              to:
                type: string
                description: 信号目标角色。
              width:
                type: string
                description: 受限宽度表达式（参数 + 算术，见 tools 校验器）。
              required:
                type: boolean
                default: true
              capability:
                type: string
                description: 关联的可选 Capability ID；设置后视为可选信号。
              default_tieoff:
                description: 可选信号缺省 tie-off 值。
              description: {type: string}

  capabilities:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
        default:
          type: boolean
        description: {type: string}

  semantics:
    type: object
    description: 事务、时序、错误和顺序语义的自由格式键值（值必须为标量或数组）。
    additionalProperties: true

  compatibility:
    type: object
    additionalProperties: false
    properties:
      api_major: {type: integer}
      type_fingerprint:
        type: string
        description: 生成器输出的类型指纹，防止同名异构类型混用。
      rules:
        type: array
        items:
          type: object
          additionalProperties: true
      description: {type: string}

  views:
    type: object
    additionalProperties: false
    required: [packed_struct, sv_interface, flattened]
    properties:
      packed_struct:
        type: boolean
      sv_interface:
        type: boolean
      flattened:
        type: boolean
      ipxact:
        type: string
        enum: [required, optional, none]
      notes: {type: string}
