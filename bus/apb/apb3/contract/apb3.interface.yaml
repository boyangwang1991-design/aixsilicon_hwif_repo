# AIXSILICON HW Interface Contract — apb3
# AMBA APB3 端点契约（L3）— 与 apb4 平行、独立的严格信号集。
# APB3 相对 APB2 新增 PREADY/PSLVERR（wait state + error 响应）；
# 不含 APB4 的 PPROT/PSTRB/PWAKEUP。
schema_version: "1.0"

interface:
  id: IFC-APB3-001
  name: aix_apb3
  family: apb
  semantic_version: 1.0.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: commercial
  document_id: AMBA-APB-PROTOCOL
  revision: "APB3"
  url: https://developer.arm.com/Architectures/AMBA
  note: >-
    APB3 信号全集：PSEL/PENABLE/PADDR/PWRITE/PWDATA/PRDATA/PREADY/PSLVERR。
    无 PSTRB/PPROT/PWAKEUP（APB4 专属）。

roles:
  - id: initiator
    aliases: [manager, master]
  - id: target
    aliases: [subordinate, slave]

parameters:
  - id: ADDR_W
    type: uint
    default: 32
    constraints:
      min: 1
  - id: DATA_W
    type: uint
    default: 32
    constraints:
      min: 8
      multiple_of: 8

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: apb
    handshake: apb
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: psel
        from: initiator
        to: target
        width: "1"
        required: true
      - id: penable
        from: initiator
        to: target
        width: "1"
        required: true
      - id: paddr
        from: initiator
        to: target
        width: "ADDR_W"
        required: true
      - id: pwrite
        from: initiator
        to: target
        width: "1"
        required: true
      - id: pwdata
        from: initiator
        to: target
        width: "DATA_W"
        required: true
      - id: prdata
        from: target
        to: initiator
        width: "DATA_W"
        required: true
      - id: pready
        from: target
        to: initiator
        width: "1"
        required: true
      - id: pslverr
        from: target
        to: initiator
        width: "1"
        required: true

capabilities: []

semantics:
  transfer: "PSEL && PENABLE && PREADY"
  setup_phase: "PSEL asserted without PENABLE"
  access_phase: "PSEL && PENABLE; completes when PREADY"
  wait_states: "PREADY low extends access phase (APB3)"
  error_handling: "PSLVERR asserted during access phase to signal slave error"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional