# AIXSILICON HW Interface Contract — uart（骨架）
# UART 引脚接口（L4）。
schema_version: "1.0"

interface:
  id: IFC-UART-001
  name: aix_uart
  family: uart
  semantic_version: 0.1.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: open
  document_id: UART-EIA-232
  revision: "n/a"
  note: "工业标准，非本仓复制内容"

roles:
  - id: controller
  - id: endpoint

parameters: []

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: uart_pins
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: tx
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: rx
        from: endpoint
        to: controller
        width: "1"
        required: true
      - id: cts
        from: endpoint
        to: controller
        width: "1"
        required: false
        capability: flow_control
      - id: rts
        from: controller
        to: endpoint
        width: "1"
        required: false
        capability: flow_control

capabilities:
  - id: flow_control
    default: false

semantics:
  idle_state: "tx idle high"
  synchronization: "async inputs synchronized at integration"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
