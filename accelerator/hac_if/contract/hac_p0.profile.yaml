# AIXSILICON HW Interface Profile — hac_p0
# HAC-P0 Control Profile：小型控制核（随机数、校验、小型密码运算）。
# 标准 profile 结构（引用基础接口 ID，冻结 capability；不复制信号）。
schema_version: "1.0"

profile:
  id: IFC-PROFILE-HAC-P0-001
  interface: IFC-HAC-CTRL-001
  version: 0.1.0
  owner: hw-platform
  lifecycle: draft
  capabilities:
    event: required
    ctrl_ap_hs: required
    stream: optional
    mem: optional
    lmem: optional
    mgmt: optional
  parameter_constraints:
    max_inflight_jobs:
      min: 1
      max: 1
  compatibility_class: hac_p0_v1
  description: |
    HAC-P0 Control — 必选 CTRL + EVENT，推荐系统侧接口 AXI4-Lite + IRQ。
    required_families: hac_ctrl + hac_event；其余为可选族。
