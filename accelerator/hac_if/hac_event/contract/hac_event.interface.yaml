schema_version: '1.0'
interface:
  id: IFC-HAC_EVT-001
  name: aix_hac_event
  family: hac_event
  semantic_version: 1.0.0
  owner: hw-platform
  lifecycle: draft
protocol_reference:
  kind: internal
  document_id: AIX-HAC-IF-005
  revision: 1.0-draft
roles:
- id: core
- id: shell
parameters:
- id: EVENT_TYPE_W
  type: uint
  default: 3
  constraints:
    min: 3
    max: 3
- id: SEVERITY_W
  type: uint
  default: 2
  constraints:
    min: 2
    max: 2
- id: SOURCE_W
  type: uint
  default: 8
  constraints:
    min: 1
- id: JOB_ID_W
  type: uint
  default: 8
  constraints:
    min: 1
- id: CODE_W
  type: uint
  default: 16
  constraints:
    min: 16
    max: 16
- id: INFO_W
  type: uint
  default: 32
  constraints:
    min: 1
clock_domains:
- id: clk
  edge: rising
reset_domains:
- id: rst_n
  polarity: active_low
  assertion: asynchronous
  deassertion: synchronous
  clock: clk
  output_during_reset: 发送方 valid/req/ack 复位为0；响应及载荷不得为X。复位终止任务由平台恢复记录结算。
  can_interrupt_transactions: true
channels:
- id: event
  handshake: ready_valid
  clock: clk
  reset: rst_n
  ordering: in_order
  signals:
  - id: event_valid
    from: core
    to: shell
    width: '1'
    required: true
  - id: event_ready
    from: shell
    to: core
    width: '1'
    required: true
  - id: event_type
    from: core
    to: shell
    width: EVENT_TYPE_W
    required: true
  - id: severity
    from: core
    to: shell
    width: SEVERITY_W
    required: true
  - id: source
    from: core
    to: shell
    width: SOURCE_W
    required: true
  - id: job_id
    from: core
    to: shell
    width: JOB_ID_W
    required: false
    capability: job_id
    default_tieoff: 0
  - id: code
    from: core
    to: shell
    width: CODE_W
    required: true
  - id: info
    from: core
    to: shell
    width: INFO_W
    required: false
    capability: info
    default_tieoff: 0
capabilities:
- id: job_id
  default: true
- id: info
  default: true
semantics:
  source: AIXSILICON HAC organization 1.0, 2026-10-04
  handshake: valid && ready 同周期消费；valid置位不组合依赖ready；阻塞期间valid与全部载荷保持直到握手。
  optional_driver: 可选字段启用时由from角色唯一驱动；关闭时由该发送方按default_tieoff驱动，接口视图不无条件绑死。
  width_policy: 物理宽度参数至少1；关闭的逻辑字段在绑定层省略或常量驱动，不生成负索引向量。
  types: 0终态通知镜像，1可恢复错误，2fatal，3性能，4安全，5debug，6非终态进展，7保留；severity 0info/1warning/2fatal/3保留。
  completion_mirror: type0仅通知已由CTRL确认的终态，不再次释放资源/唤醒依赖；进展不使用type0。
  buffering: 必要错误独立预留容量，不因完成通道反压形成循环等待。可丢性能/debug只允许握手前按明确策略丢弃并计数；valid置位后不可撤回。
  fatal: fatal有独立粘滞证据，局部软复位不能清除；特权显式清理不等于解除隔离。
  irq: IRQ/MSI由Shell或共享平台生成，Core只发送语义事件。
views:
  packed_struct: false
  sv_interface: true
  flattened: false
  ipxact: optional
  notes: 本版发布参数化SV interface/doc/IP-XACT；flat生成器目前为占位，不作为可用连接视图发布。可选信号保留物理线，由端点按binding驱动；旧固定宽度package不进入1.0
    fileset。
