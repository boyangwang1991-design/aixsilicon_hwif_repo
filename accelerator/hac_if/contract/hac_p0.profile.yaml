# AIXSILICON HW Interface Profile — hac_p0
# HAC-P0 Control Profile：小型控制核（随机数、校验、小型密码运算）。
schema_version: "1.0"

profile:
  id: PRO-HAC-P0-001
  name: hac_p0
  family: hac_if
  semantic_version: 0.1.0
  description: |
    HAC-P0 Control — 必选 CTRL + EVENT，推荐系统侧接口 AXI4-Lite + IRQ。

required_families:
  - hac_ctrl
  - hac_event

optional_families:
  - hac_stream
  - hac_mem
  - hac_lmem
  - hac_mgmt

defaults:
  ctrl:
    max_inflight_jobs: 1
    ap_compatibility: ap_ctrl_hs
  system_side: AXI4-Lite + IRQ

compatibility:
  base_families: [hac_ctrl, hac_event]
  rules:
    - "advanced profiles do not need to mechanically include all optional signals of lower profiles at port level"
    - "base fields of the same family must stay backward compatible"
    - "unsupported optional inputs must be explicitly tied-off"
