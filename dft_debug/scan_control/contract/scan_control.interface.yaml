# AIXSILICON HW Interface Contract — scan_control
# 扫描测试控制抽象接口（L5，P2）。
schema_version: "1.0"

interface:
  id: IFC-SCAN-001
  name: aix_scan_control
  family: scan_control
  semantic_version: 0.1.0
  owner: hw-dft
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-SCAN-001
  revision: "0.1"

roles:
  - id: controller
  - id: endpoint

parameters: []

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: scan
    handshake: none
    clock: clk
    reset: rst_n
    signals:
      - id: scan_enable
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: test_mode
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: scan_clk
        from: controller
        to: endpoint
        width: "1"
        required: true
      - id: scan_rst
        from: controller
        to: endpoint
        width: "1"
        required: true

capabilities: []

semantics:
  scan: "scan enable/test mode/scan clock/reset abstract"

views:
  packed_struct: false
  sv_interface: true
  flattened: true
  ipxact: optional
