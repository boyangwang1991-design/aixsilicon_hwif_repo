# AIXSILICON HW Interface Contract — memory_1rw
# 单端口读写内存接口（L2）。
schema_version: "1.0"

interface:
  id: IFC-M1RW-001
  name: aix_memory_1rw
  family: memory_1rw
  semantic_version: 1.0.0
  owner: hw-platform
  lifecycle: draft

protocol_reference:
  kind: internal
  document_id: AIX-IF-M1RW-001
  revision: "1.0"

roles:
  - id: requester
    aliases: [host]
  - id: memory
    aliases: [device]

parameters:
  - id: ADDR_W
    type: uint
    default: 32
    constraints:
      min: 1
  - id: DATA_W
    type: uint
    default: 32
    constraints:
      min: 8
      multiple_of: 8
  - id: LATENCY
    type: uint
    default: 1
    constraints:
      min: 1

clock_domains:
  - id: clk
    edge: rising

reset_domains:
  - id: rst_n
    polarity: active_low
    assertion: asynchronous
    deassertion: synchronous
    clock: clk

channels:
  - id: port
    handshake: ready_valid
    clock: clk
    reset: rst_n
    ordering: in_order
    signals:
      - id: req_valid
        from: requester
        to: memory
        width: "1"
        required: true
      - id: req_ready
        from: memory
        to: requester
        width: "1"
        required: true
      - id: addr
        from: requester
        to: memory
        width: "ADDR_W"
        required: true
      - id: we
        from: requester
        to: memory
        width: "1"
        required: true
      - id: wdata
        from: requester
        to: memory
        width: "DATA_W"
        required: true
      - id: be
        from: requester
        to: memory
        width: "DATA_W / 8"
        required: true
        description: "write mask"
      - id: rdata
        from: memory
        to: requester
        width: "DATA_W"
        required: true
      - id: rsp_valid
        from: memory
        to: requester
        width: "1"
        required: true

capabilities: []

semantics:
  latency_profile: "LATENCY cycles"
  single_port: "read and write share the port, distinguished by we"

views:
  packed_struct: true
  sv_interface: true
  flattened: true
  ipxact: optional
